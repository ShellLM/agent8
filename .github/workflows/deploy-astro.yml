name: Deploy Astro site to Pages

on:
  push:
    branches: ["master", "main"]
    paths:
      - 'blog-kit/blog/**'
      - '.github/workflows/deploy-astro.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: blog-kit/blog/package-lock.json
          
      - name: Cache Astro build
        uses: actions/cache@v4
        with:
          path: |
            blog-kit/blog/node_modules/.astro
            blog-kit/blog/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('blog-kit/blog/package-lock.json') }}-${{ hashFiles('blog-kit/blog/src/**') }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('blog-kit/blog/package-lock.json') }}-
            astro-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ./blog-kit/blog
        run: npm ci --prefer-offline
        
      - name: Build with Astro
        working-directory: ./blog-kit/blog
        run: npm run build
        env:
          NODE_ENV: production
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./blog-kit/blog/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
